[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Bug-catching rules plus import order; widen gradually.
select = ["F", "E9", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
